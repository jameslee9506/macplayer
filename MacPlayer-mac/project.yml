name: MacPlayer
options:
  bundleIdPrefix: io.github.jameslee9506.macplayer
  deploymentTarget:
    macOS: "26.0"
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MacPlayer:
    type: application
    platform: macOS
    sources:
      - path: MacPlayer
        excludes:
          - "deps/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jameslee9506.macplayer.app
        PRODUCT_NAME: MacPlayer
        INFOPLIST_FILE: MacPlayer/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacPlayer/MacPlayer.entitlements
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: MacPlayer/MacPlayer-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/MacPlayer/deps/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/MacPlayer/deps/lib
        OTHER_LDFLAGS: "-lmpv -lavformat -lavcodec -lswscale -lavutil -lsqlite3 -weak_framework PIP"
        FRAMEWORK_SEARCH_PATHS: /System/Library/PrivateFrameworks
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks/MacPlayerDependencies"
        GCC_PREPROCESSOR_DEFINITIONS: "GL_SILENCE_DEPRECATION=1"
    postBuildScripts:
      - script: |
          set -eu
          destination="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/MacPlayerDependencies"
          mkdir -p "$destination"
          /usr/bin/rsync -a --delete "${PROJECT_DIR}/MacPlayer/deps/lib/" "$destination/"
          resources="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$resources"
          cp "${PROJECT_DIR}/MacPlayer/deps/manifest.json" "$resources/DependencyManifest.json"
        name: "Copy bundled libraries"
        basedOnDependencyAnalysis: false
